plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.chaquo.python'
}

// 仓库根 = android-app/ 的上一级。
// 注意 rootDir 在这里是 android-app/(Gradle 的 rootDir 指 settings 所在目录),
// 所以要往上走一级 —— 早先写成 rootDir.parentFile 反而指到了仓库根的上一层。
def repoRoot = rootDir.parentFile
def cokRoot = new File(repoRoot, "cok")
def protocolSource = new File(cokRoot, "core")
def resourcesDir = new File(cokRoot, "resources")
def generatedPython = layout.buildDirectory.dir("generated/python")

// release 签名配置: 走 android-app/keystore.properties(**不进 git**)。
// 文件缺失时 release 构建会退化成"用 debug key 签", 不阻断 —— 但正式发版
// 应该配好, 否则每次发版用户都得先卸载旧版(签名不一致装不上)。
def releaseKeystorePropsFile = project.findProperty("releaseKeystore")
        ? file(project.property("releaseKeystore"))
        : rootProject.file("keystore.properties")
def releaseKeystoreProps = new Properties()
if (releaseKeystorePropsFile.exists()) {
    releaseKeystorePropsFile.withInputStream { releaseKeystoreProps.load(it) }
}

tasks.register("preparePythonSources") {
    inputs.dir(protocolSource)
    inputs.dir(resourcesDir)
    inputs.files(
        file("${rootDir}/mobile-console.css"),
        file("${rootDir}/mobile-console.js"),
    )
    outputs.dir(generatedPython)

    doLast {
        def output = generatedPython.get().asFile
        delete(output)
        copy {
            // 只带**运行期真正 import 的**模块, 不是全部 cok_*.py:
            // 逆向期的登录实验脚本(cok_elex_account / cok_emu_login / ...)
            // 在手机上没有任何入口, 带进去只是白占体积。
            from(protocolSource) {
                include "cok_sfs.py"           // 协议编解码(所有模块的底座)
                include "cok_paths.py"         // 路径适配层(安卓端必读)
                include "cok_client.py"        // 连接/登录/账号锁
                include "cok_account.py"       // 账号读写
                include "cok_accounts.py"      // 多账号注册表 + 公共字段真值
                include "cok_users.py"         // 多用户(网页端登录)
                include "cok_gamesvc.py"       // 渠道身份 -> 角色解析
                include "cok_channel_login.py" // 渠道账号密码登录
                include "cok_hunt.py"          // 自动打怪
                include "cok_stamina.py"       // 体力
                include "cok_rally.py"         // 联盟集结
                include "cok_dock.py"          // 港口贸易
                include "cok_sky.py"           // 天空城
                include "cok_welfare.py"       // 福利
                include "cok_scoremall.py"     // 积分商城
                include "cok_alliance.py"      // 联盟
                include "cok_assist.py"        // 协助
                include "cok_daily_quest.py"   // 每日任务
                include "cok_map.py"           // 地图索引
                include "cok_excel.py"         // Excel 导出
                include "cok_locate.py"        // 按名字查坐标
                include "cok_speedup.py"       // 加速
                include "cok_daemon.py"        // 轮询/推送引擎
                include "cok_web.py"           // 本地控制台(安卓端被 WebView 加载)
            }
            // 全图扫描核心: 安卓端进程内线程调用 scan_world.run_scan(), 必须进包
            from(new File(cokRoot, "tools")) {
                include "scan_world.py"
            }
            from(resourcesDir) {
                include "id-names.json"
                include "bag-items.json"
                include "speedup-items.json"
                include "speedup-meta.json"
                include "speedup-owned.json"
                include "shield-specs.json"
                include "game-config.json"
                include "monster-levels.json"
                include "command-catalog-typed.json"
                include "param-types-override.json"
                include "cok_webui.html"
            }
            into(output)
        }

        // The desktop source carries local development credentials. The Android
        // artifact gets only a protocol template; users add their own account.
        def client = new File(output, "cok_client.py")
        def safeAccount = '''ACCOUNT = {
    "pfId": "",
    "platformToken": "",
    "gameUid": "",
    "deviceId": "android",
    "uuid": "",
    "buildCode": "",
    "signCode": "",
    "host": "txaia-cok.elexapp.com",
    "port": 32231,
    # This is protocol-wide bootstrap configuration, not a user credential.
    # Leaving it empty permits authentication but causes the server to discard
    # all encrypted game commands after login.
    "baseActiveKey": "<baseActiveKey>",
    "packageName": "com.hcg.cok.nearme.gamecenter",
    "appVersion": "12.06.0",
    "luaVersion": "release_12.06.0_25",
    "serverId": "2223",
    "parseRegisterId": "",
    "pf": "cn_ewanqf",
    "channelSign": "bang",
    "isSmall": "kao",
    "isHDLogin": "0",
    "lang": "zh_CN",
    "region": "CN",
    "fromCountry": "CN",
    "subscriberId": "default",
    "phoneDevice": "android",
    "pfchild": "",
    "gaid": "",
    "gmUid": "",
    "gmLogin": TypedInt(0, SFS_INT),
    "afUID": "",
    "googlePlay": "",
    "pfSign": "",
    "linkname": "",
    "instantAppCookie": "",
    "zn": "COK2223",
    "pw": "",
    "device_info": {
        "operator_name": "",
        "screen_h": TypedInt(2400, SFS_INT),
        "screen_w": TypedInt(1080, SFS_INT),
        "os_build": "Android",
        "screen_density": TypedInt(420, SFS_INT),
        "operators": "UNKNOWN",
        "os_version": "9.9.9",
        "model": "Android",
        "os_serial": "unknown",
        "os_fgpt": "",
        "network_type": TypedInt(0, SFS_INT),
    },
}
'''
        // ---- 把协议公共字段/渠道 signCode 的**真值**烘焙进 APK ------------------
        //
        // 为什么必须烘焙: 公开仓库里 baseActiveKey 是脱敏占位符, signCode 是空串。
        // 不烘焙的话, 别人**直接装这个 APK** 会遇到:
        //   * signCode 空 -> 加号被判"凭据不完整(缺 signCode)", 加不进去
        //   * baseActiveKey 空 -> 服务端丢弃所有加密指令 -> "登录成功但界面全空"
        // 真值只存在于**本地 gitignored 缓存**(不会被提交进仓库), 但会进构建产物。
        //
        // 种子来源(按顺序找第一个存在的):
        //   1. COK-CN1-analysis/protocol/data/public-fields.json (桌面端本地缓存)
        //   2. android-app/local-seed/public-fields.json (发给要自己打包的人)
        def seedCandidates = [
            new File(cokRoot, "data/public-fields.json"),
            new File(rootDir, "local-seed/public-fields.json"),
        ]
        def seedFile = seedCandidates.find { it.exists() }
        if (seedFile == null) {
            throw new GradleException(
                "APK 种子缺失: 找不到 public-fields.json(协议公共字段真值)。\n" +
                "已找过: " + seedCandidates.collect { it.path }.join(", ") + "\n" +
                "没有它打包出来的 APK 会'登录成功但界面全空'(baseActiveKey 空)。\n" +
                "请先在桌面端真机登录一次让程序学到真值, 或手工放一份到上面任一路径。")
        }
        def seedText = seedFile.getText("UTF-8")
        def signSeedFile = new File(seedFile.parentFile, "sign-codes.json")
        def signSeedText = signSeedFile.exists() ? signSeedFile.getText("UTF-8") : "{}"
        // 渠道 signCode: 缓存文件优先; 缓存没有/是空的就从**账号库**现派生
        // (同 packageName 取**最新**入库的那个 —— 渠道包换证书后 signCode 会变)。
        def signJson = new groovy.json.JsonSlurper().parseText(signSeedText)
        if (!signJson) {
            def accountsDir = new File(cokRoot, "data/accounts")
            if (accountsDir.exists()) {
                def newest = [:]
                accountsDir.eachFile { f ->
                    if (!f.isFile() || !f.name.endsWith(".json")) return
                    if (f.name.endsWith(".items.json") || f.name.startsWith(".")) return
                    try {
                        def a = new groovy.json.JsonSlurper().parseText(f.getText("UTF-8"))
                        if (!(a instanceof Map)) return
                        def pkg = (a["packageName"] ?: "").toString()
                        def code = (a["signCode"] ?: "").toString().trim()
                        if (!pkg || !code || code.startsWith("<")) return
                        def added = (a["added"] ?: "").toString()
                        if (!newest.containsKey(pkg) || added > newest[pkg][0]) {
                            newest[pkg] = [added, code]
                        }
                    } catch (Exception ignored) {
                    }
                }
                if (newest) {
                    signJson = newest.collectEntries { k, v -> [(k.toString()): v[1].toString()] }
                }
            }
        }

        // 注入真 baseActiveKey 到 ACCOUNT 模板(占位符 -> 真值)。
        // 只注入**协议级公共字段**, 不碰任何账号身份字段。
        def seedJson = new groovy.json.JsonSlurper().parseText(seedText)
        def realKey = (seedJson["baseActiveKey"] ?: "").toString()
        if (!realKey || realKey.startsWith("<")) {
            throw new GradleException(
                "APK 种子无效: ${seedFile} 里的 baseActiveKey 是空的或占位符(${realKey})。\n" +
                "请放一份含**真值**的 public-fields.json。")
        }
        def safeAccountReal = safeAccount.replace(
            '"baseActiveKey": "<baseActiveKey>"',
            '"baseActiveKey": "' + realKey.replace("\\", "\\\\").replace('"', '\\"') + '"')
        if (safeAccountReal.contains("<baseActiveKey>")) {
            throw new GradleException(
                "APK 种子注入失败: ACCOUNT 模板里的 baseActiveKey 占位符没被替换。")
        }

        // 生成 cok_seed.json 运行时兜底(APK 内置真值)。
        // 运行时优先级: 账号库 > 本地缓存 > APK 内置种子 > 模板占位符。
        if (!signJson) {
            throw new GradleException(
                "APK 种子里没有任何渠道 signCode。\n" +
                "没有它, 别人直接装 APK 后加号必然被判「凭据不完整(缺 signCode)」。\n" +
                "请先在桌面端真机登录一次果盘账号(学到 signCode), 或手工放一份\n" +
                "sign-codes.json 放到 ${seedFile.parentFile}。")
        }
        def payload = [
            public_fields: seedJson.collectEntries { k, v -> [(k.toString()): v.toString()] },
            sign_codes   : signJson.collectEntries { k, v -> [(k.toString()): v.toString()] },
        ]
        new File(output, "cok_seed.json").setText(
            groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(payload)), "UTF-8")

        // ⚠ 正则必须带 MULTILINE(?sm): `^}` 要匹配"行首的 }"这种 ACCOUNT 块的结尾。
        //    少了 m 的话 `^` 只匹配字符串开头, 正则匹配不到 -> 替换静默失败,
        //    **桌面端的游戏账号凭据会被原样打进 APK**(2026-10-31 踩过这个坑)。
        //    结尾锚在"行首的 }"上, **不要**再额外要求后面紧跟 `def log` ——
        //    那样一来在 ACCOUNT 和 def log 之间插任何东西(哪怕一个函数)
        //    都会让正则匹配不上, 替换静默失败(2026-11-12 又踩了一次,
        //    靠下面那句"APK 安全自检"拦住的, 但别去踩)。
        //    嵌套的 device_info 字典收尾是缩进的 `    },`, 不会误匹配。
        client.text = client.text.replaceFirst(/(?sm)^ACCOUNT = \{.*?^\}\n/, safeAccountReal)
        // 打包后**自检**: 整个产物里不能残留任何桌面端账号凭据。
        //   1) cok_client.py 的内置账号必须被清空
        //   2) 所有文件里都不能出现源账号的真实凭据串
        // 敏感串从**源码的 ACCOUNT 块**里现取, 不写死在本脚本里
        // (写死等于把凭据又抄进构建脚本)。
        def srcClient = new File(protocolSource, "cok_client.py")
        def sensitive = []
        if (srcClient.exists()) {
            def src = srcClient.text
            def m = (src =~ /(?sm)ACCOUNT = \{.*?^\}/)
            if (m) {
                def acct = m[0]
                ["pfId", "platformToken", "uuid", "buildCode", "deviceId"].each { k ->
                    def kv = (acct =~ /(?m)"${k}"\s*:\s*"([^"]*)"/)
                    if (kv) {
                        def v = kv[0][1]
                        // 跳过明显是占位/模板的值
                        if (v && !v.startsWith("android") && v != "0") sensitive << v
                    }
                }
            }
        }
        if (client.text.contains("ACCOUNT = {") && !client.text.contains('"pfId": ""')) {
            throw new GradleException(
                "APK 安全自检失败: cok_client.py 里的内置账号没有被清空 " +
                "(桌面端凭据会被打进 APK)。请检查 ACCOUNT 块的替换正则。")
        }
        if (sensitive) {
            def hits = []
            output.eachFileRecurse { f ->
                if (!f.isFile()) return
                if (f.name.endsWith(".pyc")) return
                def txt = null
                try { txt = f.getText("UTF-8") } catch (Exception ignored) { return }
                sensitive.each { s ->
                    if (txt.contains(s)) hits << "${f.name} 含 ${s.take(6)}…"
                }
            }
            if (hits) {
                throw new GradleException(
                    "APK 安全自检失败: 产物里残留桌面端凭据 -> " + hits.join(", "))
            }
        }
        client.text = client.text.replace(
            "import fcntl",
            '''try:
    import fcntl
except ImportError:
    class _AndroidFcntl(object):
        LOCK_EX = 0
        LOCK_NB = 0
        LOCK_UN = 0

        @staticmethod
        def flock(fd, operation):
            return None

    fcntl = _AndroidFcntl()'''
        )

        // Keep the shared desktop console unchanged. The Android artifact gets
        // its own mobile information architecture and presentation layer.
        def html = new File(output, "cok_webui.html")
        // Kept here temporarily as reference while the dedicated stylesheet
        // evolves. It is intentionally not injected into the APK.
        def legacyMobileCss = '''
  /* Android app: touch-first layout, applied only to the packaged console. */
  @media (max-width:640px){
    :root{
      --bg:#0b1019; --bg2:#101722; --panel:#151e2b; --panel2:#1a2534;
      --panel3:#223044; --line:#2b3a4d; --line2:#223044; --fg:#f4f7fb;
      --dim:#a9b6c9; --dim2:#8090a6; --accent:#4d8dff; --accent2:#8bb7ff;
      --radius:8px; --radius-sm:6px;
    }
    body{
      font-size:14px; line-height:1.5; background:var(--bg); background-image:none;
      padding-bottom:env(safe-area-inset-bottom);
    }
    header{
      display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; padding:12px 16px 10px; align-items:center;
      background:rgba(11,16,25,.97); border-bottom-color:var(--line);
    }
    h1{width:auto; min-width:0; font-size:18px; letter-spacing:0; color:#fff;
       background:none; -webkit-text-fill-color:initial}
    #connBadge{justify-self:end; max-width:150px; overflow:hidden; white-space:nowrap}
    #connBadge .connFresh{display:none}
    .badge{gap:5px; min-height:32px; padding:5px 9px; border-radius:6px;
           box-shadow:none; font-size:12px; background:var(--panel2)}
    #connText{font-size:0}
    #connText::after{content:"连接";font-size:12px}
    #acctBadge{grid-column:1/-1; min-width:0; width:100%}
    #acctSelect{min-width:0; flex:1; max-width:none!important}
    #acctBadge button{min-width:28px; min-height:28px; padding:0 4px!important}
    header>.badge:not(#acctBadge):not(:has(#connText)):not(:has(#sLast)):not(#sGold),
    #sDate,#sMode{display:none}
    #sGold{display:none}
    header>.spacer{display:none}
    .headerActions{grid-column:1/-1; display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; width:100%}
    .headerActions label.badge{display:none}
    #btnRefresh{grid-column:span 1; justify-content:center; min-height:38px;
      border-color:#5b99ff; background:#2f77ed; box-shadow:none}
    #btnReconnect,#btnDisconnect{min-height:38px; justify-content:center}
    #btnKeys{display:none}

    .banner{margin:10px 16px 0; padding:10px 12px; border-radius:6px; font-size:12.5px; box-shadow:none}
    .ovbar{
      display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; overflow:visible;
      margin:12px 16px 0; padding:0; border:0; border-radius:0; background:transparent; box-shadow:none;
    }
